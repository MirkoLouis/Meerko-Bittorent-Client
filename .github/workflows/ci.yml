# Build the Nix package and run the test suite on every push to master and every pull request
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # nix flake check builds the package, whose check phase runs pytest
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Flake check
        run: nix flake check -L
