# SPDX-License-Identifier: GPL-3.0-or-later
# Build release binaries and publish a GitHub Release.
#   Tag push (v*):        build, sign checksums, publish the release.
#   Manual dispatch:      same build and signing as a dry run; results are uploaded as a workflow artifact only.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the dry-run build (nothing is published)"
        required: true
        default: "1.0.0.dev0"

# Read-only by default; only the release job is granted write access
permissions:
  contents: read

# Untrusted text (tag name or dispatch input) only ever reaches scripts as this env var;
# packaging/stamp_version.py and build-appimage.sh validate it before use
env:
  RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  # Windows: PyInstaller onefile executable
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Stamp version
        run: python packaging/stamp_version.py "$RELEASE_VERSION"

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build executables
        run: pyinstaller --noconfirm packaging/meerko-bittorent.spec

      # The frozen CLI must start and load libtorrent (catches missing DLLs before users do)
      - name: Smoke-test frozen CLI
        run: dist/meerko-bittorent-cli.exe --version

      # Name the assets with the validated, stamped version (read back from the package)
      - name: Name release assets
        run: |
          version="$(python -c 'import meerko_bittorent; print(meerko_bittorent.__version__)')"
          mkdir -p release
          mv dist/meerko-bittorent.exe "release/Meerko-Bittorent-${version}-windows-x86_64.exe"
          mv dist/meerko-bittorent-cli.exe "release/Meerko-Bittorent-${version}-windows-x86_64-cli.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release/
          if-no-files-found: error

  # Linux: PyInstaller onedir packed into an AppImage; built on 22.04 for broad glibc compatibility
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Python, libtorrent and Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-libtorrent python3-tk python3-venv python3-pip file

      - name: Stamp version
        run: python3 packaging/stamp_version.py "$RELEASE_VERSION"

      # The venv sees apt's libtorrent through --system-site-packages
      - name: Install PyInstaller
        run: |
          python3 -m venv --system-site-packages .venv-linux
          .venv-linux/bin/pip install pyinstaller

      - name: Build onedir
        run: .venv-linux/bin/pyinstaller --noconfirm packaging/meerko-bittorent.spec

      # The frozen CLI must start and load libtorrent 2.0.5 before it is packed
      - name: Smoke-test frozen CLI
        run: dist/meerko-bittorent/meerko-bittorent-cli --version

      - name: Pack AppImage
        run: |
          version="$(python3 -c 'import meerko_bittorent; print(meerko_bittorent.__version__)')"
          packaging/build-appimage.sh "$version"
          mkdir -p release
          mv dist/*.AppImage release/

      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: release/
          if-no-files-found: error

  # Checksums, GPG signature and (on tags) the GitHub Release itself
  release:
    needs: [windows, appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_KEY_FINGERPRINT: A831ABC3E4CA419F45A5F0CAAE8BE4A90597C13C
    steps:
      # The checkout provides CHANGELOG.md for the release notes
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Write checksums
        working-directory: release
        run: sha256sum -- * > SHA256SUMS

      - uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # Sign with the one release key, then prove the signature verifies
      - name: Sign checksums
        working-directory: release
        run: |
          gpg --batch --yes --local-user "$SIGNING_KEY_FINGERPRINT" --detach-sign --armor SHA256SUMS
          gpg --verify SHA256SUMS.asc SHA256SUMS

      # Release notes: the CHANGELOG section for this version, or a pointer to the file
      - name: Extract release notes
        run: |
          version="${RELEASE_VERSION#v}"
          awk -v heading="## [${version}]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/        { exit }
              found                    { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
              echo "See CHANGELOG.md" > notes.md
          fi

      # a/b/rc/dev versions are pre-releases and must never become "Latest"
      - name: Classify release
        id: classify
        run: |
          if [[ "${RELEASE_VERSION#v}" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Publish only on a real tag push; a manual dispatch from a tag ref stays a dry run
      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          body_path: notes.md
          draft: false
          prerelease: ${{ steps.classify.outputs.prerelease == 'true' }}

      - name: Upload dry-run bundle
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-release
          path: release/
          if-no-files-found: error
